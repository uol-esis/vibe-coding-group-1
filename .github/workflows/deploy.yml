name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            BUILD_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare Portainer compose
        run: |
          yq -i '
            .services.app.image = strenv(IMAGE) |
            del(.services.app.build)
          ' docker-compose.yml

          cat docker-compose.yml

      - name: Update Portainer stack
        env:
          API_HOST: ${{ secrets.PORTAINER_API_HOST }}
          API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
          ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
        run: |
          set -euo pipefail

          curl --fail-with-body --show-error --silent \
            "$API_HOST/api/stacks/$STACK_ID" \
            -H "X-API-KEY: $API_KEY" \
            -o stack.json \
            || { cat stack.json; exit 1; }

          jq -n \
            --rawfile file docker-compose.yml \
            --argjson env "$(jq '.Env // []' stack.json)" \
            '{
              env: $env,
              prune: false,
              pullImage: true,
              stackFileContent: $file
            }' |
          curl --fail-with-body --show-error --silent \
            -X PUT \
            "$API_HOST/api/stacks/$STACK_ID?endpointId=$ENDPOINT_ID" \
            -H "Content-Type: application/json" \
            -H "X-API-KEY: $API_KEY" \
            --data-binary @- \
            -o response.json \
            || { cat response.json; exit 1; }

          echo "Deployed $IMAGE"
